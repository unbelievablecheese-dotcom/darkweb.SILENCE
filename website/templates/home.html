{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h1 class="text-center mt-4">Notes</h1>
<div class="text-center mb-4">
  <a
    href="{{ url_for('static', filename='notes-illustration.svg') }}"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open the notes illustration"
    title="Open image"
  >
    <img
      src="{{ url_for('static', filename='notes-illustration.svg') }}"
      alt="A notebook with a pencil"
      class="img-fluid"
      style="max-width: 160px"
    />
  </a>
</div>
<ul class="list-group list-group-flush" id="notes">
  {% for note in user.notes %}
  <li class="list-group-item">
    {{ note.data }}
    <button
      type="button"
      class="close"
      data-note-id="{{ note.id }}"
      aria-label="Delete note"
      title="Delete note"
    >
      <i class="fa fa-trash" aria-hidden="true"></i>
    </button>
  </li>
  {% endfor %}
</ul>
<form method="POST">
  <textarea
    name="note"
    id="note"
    class="form-control"
    aria-label="Write a note"
  ></textarea>
  <br />
  <div class="text-center">
    <button type="submit" class="btn btn-primary">
      <i class="fa fa-plus" aria-hidden="true"></i>
      Add Note
    </button>
  </div>
</form>
{% endblock %}
