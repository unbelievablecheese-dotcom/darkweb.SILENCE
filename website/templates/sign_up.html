{% extends "base.html" %}
{% block title %}JOIN // SILENCE{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="section-kicker">SILENCE // NEW MEMBER</p>
  <h1>JOIN THE QUIET.</h1>
  <p class="auth-description">Create an account for SILENCE and keep your notes private.</p>
  <form method="POST" class="auth-form">
    <div class="form-group">
      <label for="email">EMAIL ADDRESS</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" autocomplete="email" required />
    </div>
    <div class="form-group">
      <label for="firstName">GAMER NAME</label>
      <input type="text" class="form-control" id="firstName" name="firstName" placeholder="Enter your name" autocomplete="given-name" required />
    </div>
    <div class="form-group">
      <label for="password1">PASSWORD</label>
      <input type="password" class="form-control" id="password1" name="password1" placeholder="At least 7 characters" autocomplete="new-password" minlength="7" required />
    </div>
    <div class="form-group">
      <label for="password2">CONFIRM PASSWORD</label>
      <input type="password" class="form-control" id="password2" name="password2" placeholder="Enter your password again" autocomplete="new-password" minlength="7" required />
    </div>
    <button type="submit" class="auth-submit">CREATE SILENCE ACCOUNT</button>
  </form>
  <p class="auth-switch">ALREADY WITH SILENCE? <a href="{{ url_for('auth.login') }}">SIGN IN</a></p>
</section>
{% endblock %}
