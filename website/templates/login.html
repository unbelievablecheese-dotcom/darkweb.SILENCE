{% extends "base.html" %}
{% block title %}Sign in | Harvey Market{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">WELCOME BACK</p>
  <h1>Sign in to Harvey Market</h1>
  <p class="auth-description">Access your saved notes and personal demo basket.</p>
  <form method="POST" class="auth-form">
  <div class="form-group">
    <label for="email">Email Address</label>
    <input
      type="email"
      class="form-control"
      id="email"
      name="email"
      placeholder="Enter email"
    />
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input
      type="password"
      class="form-control"
      id="password"
      name="password"
      placeholder="Enter password"
    />
  </div>
  <br />
  <button type="submit" class="auth-submit">Sign in</button>
  </form>
  <p class="auth-switch">New here? <a href="{{ url_for('auth.sign_up') }}">Create an account</a></p>
</section>
{% endblock %}
