{% extends "base.html" %}
{% block title %}SIGN IN // SILENCE{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="section-kicker">SILENCE // MEMBER ACCESS</p>
  <h1>WELCOME BACK</h1>
  <p class="auth-description">Sign in to access your SILENCE account and private notes.</p>
  <form method="POST" class="auth-form">
    <div class="form-group">
      <label for="email">EMAIL ADDRESS</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" autocomplete="email" required />
    </div>
    <div class="form-group">
      <label for="password">PASSWORD</label>
      <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="auth-submit">SIGN IN TO SILENCE</button>
  </form>
  <p class="auth-switch">NEW TO SILENCE? <a href="{{ url_for('auth.sign_up') }}">CREATE AN ACCOUNT</a></p>
  <a class="auth-coach-button" href="{{ url_for('coach.sign_up') }}">COACH? REQUEST A COACH ACCOUNT <span aria-hidden="true">↗</span></a>
</section>
{% endblock %}
