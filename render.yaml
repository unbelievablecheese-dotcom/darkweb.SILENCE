services:
  - type: web
    name: flask-notes
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    disk:
      name: notes-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/database.db
